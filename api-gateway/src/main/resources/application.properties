spring.application.name=api-gateway
server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

spring.cloud.gateway.server.webmvc.routes[0].id=auth-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/auth/**


spring.cloud.gateway.server.webmvc.routes[1].id=auth-service-secure
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/secure/**

spring.cloud.gateway.server.webmvc.routes[2].id=ai-provider-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://AI-PROVIDER-SERVICE
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/chat/**

spring.cloud.gateway.server.webmvc.routes[3].id=provider-orchestrator
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://PROVIDER-ORCHESTRATOR
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/ask/**