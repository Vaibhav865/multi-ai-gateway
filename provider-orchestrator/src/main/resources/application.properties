spring.application.name=provider-orchestrator
server.port=8083

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true



spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.security.protocol=SSL
spring.kafka.ssl.trust-store-location=classpath:client.truststore.jks
spring.kafka.ssl.trust-store-password=${KAFKA_SSL_PASSWORD}
spring.kafka.ssl.key-store-location=classpath:client.keystore.p12
spring.kafka.ssl.key-store-password=${KAFKA_SSL_PASSWORD}
spring.kafka.ssl.key-store-type=PKCS12

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

logging.level.org.apache.kafka=DEBUG
logging.level.javax.net.ssl=DEBUG


spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=6379
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=true
spring.data.redis.client-type=jedis


spring.data.redis.timeout=2000ms
spring.data.redis.connect-timeout=2000ms
